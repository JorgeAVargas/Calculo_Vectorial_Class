            { text: "Inconcluso.", rationale: "Es concluso pues $D \\neq 0$.", isCorrect: false }
        ],
        hint: "Calcule las segundas derivadas y el discriminante $D$ en el origen."
    }
];

// Variables de estado
let currentQuestionIndex = 0;
let score = 0;
let answered = false;

// Elementos del DOM
const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const nextBtn = document.getElementById('next-btn');
const feedbackSection = document.getElementById('feedback');
const feedbackTitle = document.getElementById('feedback-title');
const feedbackRationale = document.getElementById('feedback-rationale');
const progressBar = document.getElementById('progress');
const questionCounter = document.getElementById('question-counter');
const hintText = document.getElementById('hint-text');
const quizActive = document.getElementById('quiz-active');
const resultsSection = document.getElementById('results');
const finalScore = document.getElementById('final-score');
const scoreMessage = document.getElementById('score-message');

// Función para iniciar/cargar pregunta
function loadQuestion() {
    answered = false;
    const currentQuestion = quizData[currentQuestionIndex];

    // Actualizar UI básica
    questionCounter.textContent = `Pregunta ${currentQuestionIndex + 1} de ${quizData.length}`;
    progressBar.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;

    // Resetear estados
    nextBtn.style.display = 'none';
    feedbackSection.style.display = 'none';
    hintText.style.display = 'none';
    optionsContainer.innerHTML = '';

    // Cargar texto de pregunta y renderizar matemáticas
    questionText.innerHTML = currentQuestion.question;

    // Crear botones de opciones
    currentQuestion.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.innerHTML = option.text;
        button.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(button);
    });

    // Decirle a MathJax que renderice las nuevas fórmulas
    MathJax.typesetPromise();
}

// Función para verificar respuesta
function checkAnswer(selectedIndex) {
    if (answered) return;
    answered = true;

    const currentQuestion = quizData[currentQuestionIndex];
    const options = optionsContainer.children;
    const selectedOption = currentQuestion.options[selectedIndex];

    // Mostrar feedback
    feedbackSection.style.display = 'block';
    if (selectedOption.isCorrect) {
        score++;
        options[selectedIndex].classList.add('correct');
        feedbackSection.className = 'feedback-section feedback-correct';
        feedbackTitle.textContent = '¡Correcto! 🎉';
    } else {
        options[selectedIndex].classList.add('incorrect');
        feedbackSection.className = 'feedback-section feedback-incorrect';
        feedbackTitle.textContent = 'Incorrecto';
        // Resaltar la correcta
        currentQuestion.options.forEach((opt, idx) => {
            if (opt.isCorrect) {
                options[idx].classList.add('correct');
            }
        });
    }

    feedbackRationale.innerHTML = selectedOption.rationale;
    nextBtn.style.display = 'block';

    // Deshabilitar todos los botones
    for (let btn of options) {
        btn.disabled = true;
    }

    MathJax.typesetPromise();
}

// Función para mostrar pista
function toggleHint() {
    const currentQuestion = quizData[currentQuestionIndex];
    if (hintText.style.display === 'none' || hintText.style.display === '') {
        hintText.innerHTML = currentQuestion.hint;
        hintText.style.display = 'block';
        MathJax.typesetPromise();
    } else {
        hintText.style.display = 'none';
    }
}

// Función para siguiente pregunta
function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

// Función para mostrar resultados finales
function showResults() {
    quizActive.style.display = 'none';
    resultsSection.style.display = 'block';
    finalScore.textContent = `${score} / ${quizData.length}`;

    const percentage = (score / quizData.length) * 100;
    let message = '';
    if (percentage >= 90) message = '¡Excelente trabajo! Estás listo para el parcial. 🌟';
    else if (percentage >= 70) message = '¡Buen trabajo! Tienes los conceptos clave, repasa los pequeños errores. 👍';
    else message = 'Sigue practicando. Revisa los temas donde fallaste y vuelve a intentarlo. 💪';

    scoreMessage.textContent = message;
}

// Iniciar el quiz
loadQuestion();
</script>

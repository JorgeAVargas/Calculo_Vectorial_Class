<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Repaso de Cálculo Multivariable</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.quiz-container {
  border: 1px solid #e2e8f0;
  border-radius: 0.75rem;
  box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  overflow: hidden;
}
.answer-btn { transition: background-color 0.2s, border-color 0.2s; }
.answer-btn.correct {
  background-color: #dcfce7 !important;
  border-color: #22c55e !important;
  color: #166534 !important;
}
.answer-btn.incorrect {
  background-color: #fee2e2 !important;
  border-color: #ef4444 !important;
  color: #991b1b !important;
}
.answer-btn:disabled { cursor: not-allowed; }
</style>
</head>
<body class="bg-gray-50 text-gray-800">

<div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-4xl">
  <header class="text-center mb-8">
    <h1 class="text-3xl sm:text-4xl font-bold text-gray-900">Repaso de Cálculo Multivariable</h1>
  </header>

  <main>
    <!-- Examen Interactivo -->
    <div class="bg-white p-6 sm:p-8 rounded-lg shadow-md mb-8">
      <h2 class="text-2xl font-semibold mb-6">Examen Interactivo de Práctica</h2>
      <p class="mb-6">Responde las siguientes 20 preguntas (10 de teoría y 10 de práctica) para evaluar tu comprensión. Lee la justificación tras cada respuesta para reforzar conceptos.</p>
      <div id="quiz-app" class="quiz-container p-6">
        <div id="question-container" class="mb-4">
          <p id="question-text" class="text-lg font-semibold text-gray-900"></p>
        </div>
        <div id="answer-options" class="grid grid-cols-1 gap-4"></div>
        <div id="feedback-container" class="mt-4 text-sm text-gray-700">
          <p id="rationale-text"></p>
        </div>
        <div class="mt-6 flex justify-between items-center">
          <p id="progress-text" class="text-sm text-gray-500"></p>
          <button id="next-btn"
                  class="px-6 py-2 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 hidden">
            Siguiente
          </button>
        </div>
        <div id="results-container" class="hidden text-center">
          <h3 class="text-2xl font-bold">¡Examen completado!</h3>
            <p id="score-text" class="text-xl mt-4"></p>
            <button id="restart-btn"
                    class="mt-6 px-6 py-2 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-700">
              Intentar de Nuevo
            </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
/* ===================== Examen Interactivo ===================== */
const quizData = [
  // Teoría (10)
  {
    question: "¿Cuál es la condición necesaria (pero no suficiente) para que converja una serie ∑ a_n?",
    options: [
      { text: "Que a_n sea decreciente.", isCorrect: false, rationale: "La monotonía no basta; es un criterio en algunas pruebas." },
      { text: "Que lim(n→∞) a_n = 0.", isCorrect: true, rationale: "Si los términos no van a 0, la serie diverge. Es necesaria, no suficiente." },
      { text: "Que la serie sea alternada.", isCorrect: false, rationale: "El signo alternado no garantiza convergencia." },
      { text: "Que converja la serie de términos absolutos.", isCorrect: false, rationale: "Eso es convergencia absoluta, más fuerte." }
    ]
  },
  {
    question: "¿Qué representa geométricamente |u · v| para vectores u y v?",
    options: [
      { text: "El área del paralelogramo generado por u y v.", isCorrect: false, rationale: "Eso corresponde a |u × v|." },
      { text: "La longitud del vector suma u+v.", isCorrect: false, rationale: "Eso es otra magnitud distinta." },
      { text: "El producto de las magnitudes y el coseno del ángulo entre ellos.", isCorrect: true, rationale: "|u||v|cosθ y su valor absoluto da magnitud escalar." },
      { text: "El volumen del paralelepípedo.", isCorrect: false, rationale: "El volumen se asocia a |u · (v × w)|." }
    ]
  },
  {
    question: "Diferencia entre serie de Taylor y de Maclaurin.",
    options: [
      { text: "Taylor es solo para polinomios.", isCorrect: false, rationale: "Aplica a funciones suficientemente derivables." },
      { text: "Maclaurin es un caso particular de Taylor centrado en 0.", isCorrect: true, rationale: "Maclaurin = Taylor con a = 0." },
      { text: "Maclaurin usa derivadas negativas.", isCorrect: false, rationale: "No tiene sentido derivadas negativas." },
      { text: "Taylor no aproxima funciones, solo las evalúa.", isCorrect: false, rationale: "Taylor construye polinomios aproximantes." }
    ]
  },
  {
    question: "Si u · (v × w) = 0, ¿qué se concluye?",
    options: [
      { text: "Que u, v y w son mutuamente ortogonales.", isCorrect: false, rationale: "Eso implicaría producto distinto." },
      { text: "Que el volumen del paralelepípedo es cero.", isCorrect: true, rationale: "u · (v × w) es el volumen orientado." },
      { text: "Que u = 0.", isCorrect: false, rationale: "Puede ser coplanar sin ser nulo." },
      { text: "Que v × w = 0 siempre.", isCorrect: false, rationale: "Solo si v y w son paralelos." }
    ]
  },
  {
    question: "¿Toda serie que converge absolutamente también converge condicionalmente?",
    options: [
      { text: "Verdadero.", isCorrect: false, rationale: "Convergencia absoluta implica convergencia total, no 'condicional'." },
      { text: "Falso.", isCorrect: true, rationale: "Si converge absolutamente, ya converge; 'condicional' es cuando no converge absolutamente." }
    ]
  },
  {
    question: "¿Cuándo es más útil usar coordenadas esféricas?",
    options: [
      { text: "Cuando hay simetría respecto a un punto.", isCorrect: true, rationale: "Esferas, conos, regiones radiales." },
      { text: "Cuando la región es un prisma rectangular.", isCorrect: false, rationale: "Más natural cartesiano." },
      { text: "Cuando hay simetría respecto a un eje.", isCorrect: false, rationale: "Eso sugiere cilíndricas." },
      { text: "En integrales de línea.", isCorrect: false, rationale: "Depende de la curva." }
    ]
  },
  {
    question: "Teorema de la Serie Alternada establece que:",
    options: [
      { text: "Si a_n decrece a 0, la serie alternada converge.", isCorrect: true, rationale: "Condiciones: términos decrecientes y límite 0." },
      { text: "Toda serie alternada converge.", isCorrect: false, rationale: "Debe cumplir condiciones." },
      { text: "Solo converge si es absolutamente convergente.", isCorrect: false, rationale: "Convergencia condicional es posible." },
      { text: "Converge solo si los términos son constantes.", isCorrect: false, rationale: "No tendría sentido." }
    ]
  },
  {
    question: "Producto escalar vs vectorial: característica distintiva.",
    options: [
      { text: "Escalar produce un vector, vectorial un escalar.", isCorrect: false, rationale: "Es al revés." },
      { text: "Escalar da un número; vectorial da un vector perpendicular.", isCorrect: true, rationale: "Así se distinguen en R³." },
      { text: "Ambos siempre producen escalares.", isCorrect: false, rationale: "El cruz da vector." },
      { text: "Ninguno depende del ángulo.", isCorrect: false, rationale: "Ambos dependen." }
    ]
  },
  {
    question: "Propósito principal de usar una serie de Taylor.",
    options: [
      { text: "Encontrar raíces exactas.", isCorrect: false, rationale: "No asegura raíces exactas." },
      { text: "Aproximar una función mediante un polinomio local.", isCorrect: true, rationale: "Esa es su utilidad central." },
      { text: "Volver periódica la función.", isCorrect: false, rationale: "No la hace periódica." },
      { text: "Reducir dimensión.", isCorrect: false, rationale: "No se relaciona." }
    ]
  },
  {
    question: "Si el criterio de la razón da L = 1, ¿qué se concluye?",
    options: [
      { text: "La serie converge.", isCorrect: false, rationale: "Inconclusivo." },
      { text: "La serie diverge.", isCorrect: false, rationale: "Inconclusivo." },
      { text: "No decide; hay que usar otro criterio.", isCorrect: true, rationale: "Se requiere otro análisis." },
      { text: "Que converge absolutamente.", isCorrect: false, rationale: "Eso sería L < 1." }
    ]
  },
  // Práctica (10)
  {
    question: "Calcula: lim (n→∞)(√(n² + 5n) − n)",
    options: [
      { text: "0", isCorrect: false, rationale: "Racionaliza para ver el término dominante." },
      { text: "5/2", isCorrect: true, rationale: "Tras racionalizar: ( (n²+5n) - n² ) / (√(n²+5n)+n ) ≈ (5n)/(2n)=5/2." },
      { text: "∞", isCorrect: false, rationale: "El crecimiento se cancela parcialmente." },
      { text: "1/5", isCorrect: false, rationale: "Confusión al dividir términos." }
    ]
  },
  {
    question: "Suma de la serie Σ (n=1→∞) (2/3)^n",
    options: [
      { text: "3", isCorrect: false, rationale: "Verifica la fórmula de serie geométrica." },
      { text: "2", isCorrect: true, rationale: "S = a1 / (1 - r) = (2/3)/(1 - 2/3) = 2." },
      { text: "5/3", isCorrect: false, rationale: "Cálculo incompleto." },
      { text: "1", isCorrect: false, rationale: "Valor demasiado bajo." }
    ]
  },
  {
    question: "Primeros tres términos (hasta x²) de Maclaurin para e^{2x}:",
    options: [
      { text: "1 + x + x²/2", isCorrect: false, rationale: "Eso corresponde a e^x." },
      { text: "1 + 2x + 2x²", isCorrect: true, rationale: "Derivadas: f(0)=1, f'(0)=2, f''(0)=4 => 4/2 = 2." },
      { text: "1 + 2x + 4x²/2", isCorrect: true, rationale: "Equivalente a 1+2x+2x²." },
      { text: "1 + 4x + 8x²", isCorrect: false, rationale: "Multiplicaste de más." }
    ]
  },
  {
    question: "Valor de e^{iπ}:",
    options: [
      { text: "1", isCorrect: false, rationale: "Eso sería e^{i2π}." },
      { text: "-1", isCorrect: true, rationale: "Euler: e^{iθ} = cos θ + i sin θ => cos π = -1." },
      { text: "i", isCorrect: false, rationale: "Eso sería e^{iπ/2}." },
      { text: "-i", isCorrect: false, rationale: "Eso sería e^{i3π/2}." }
    ]
  },
  {
    question: "Producto escalar: u=(2,-3,1), v=(1,5,-2)",
    options: [
      { text: "-15", isCorrect: true, rationale: "(2)(1)+(-3)(5)+(1)(-2)=2-15-2=-15." },
      { text: "5", isCorrect: false, rationale: "Revisa los signos." },
      { text: "-9", isCorrect: false, rationale: "Cálculo incompleto." },
      { text: "0", isCorrect: false, rationale: "No son ortogonales." }
    ]
  },
  {
    question: "Producto vectorial p=(1,0,-2), q=(2,-1,3)",
    options: [
      { text: "⟨-2, -7, -1⟩", isCorrect: true, rationale: "Determinante: i(0*3 - (-2)(-1)) - j(1*3 - (-2)*2)+ k(1*-1 - 0*2)= i(-2) - j(3+4)+ k(-1)=⟨-2,-7,-1⟩." },
      { text: "⟨2,7,1⟩", isCorrect: false, rationale: "Olvidaste signos." },
      { text: "⟨-2,7,1⟩", isCorrect: false, rationale: "Problema con componente j." },
      { text: "7", isCorrect: false, rationale: "Resultado debe ser vector." }
    ]
  },
  {
    question: "Área del triángulo con A(1,1,1), B(2,3,1), C(1,2,3)",
    options: [
      { text: "√21", isCorrect: false, rationale: "Eso sería área del paralelogramo si fuera correcto." },
      { text: "(1/2)√21", isCorrect: true, rationale: "Área = 1/2 ||(B-A) × (C-A)||." },
      { text: "2√21", isCorrect: false, rationale: "Escala errónea." },
      { text: "21", isCorrect: false, rationale: "Falta raíz y factor." }
    ]
  },
  {
    question: "Proyección de w=(1,2,2) sobre a=(2,0,1)",
    options: [
      { text: "4", isCorrect: false, rationale: "Eso sería el numerador del escalar." },
      { text: "(4/5) a", isCorrect: true, rationale: "proj_a w = (w·a / ||a||²) a = (4 / 5) a." },
      { text: "(5/4) a", isCorrect: false, rationale: "Invertiste la fracción." },
      { text: "Vector unitario de w", isCorrect: false, rationale: "No es lo pedido." }
    ]
  },
  {
    question: "Convierte (3,-3,5) a cilíndricas (r, θ, z):",
    options: [
      { text: "(3√2, π/4, 5)", isCorrect: false, rationale: "x>0,y<0 => cuadrante IV." },
      { text: "(3√2, -π/4, 5)", isCorrect: true, rationale: "r=√(3²+(-3)²)=3√2, θ=-π/4, z=5." },
      { text: "(6, -π/4, 5)", isCorrect: false, rationale: "r mal calculado." },
      { text: "(√6, -π/4, 5)", isCorrect: false, rationale: "Confusión en r." }
    ]
  },
  {
    question: "Superficie φ = π/4 en esféricas (convención: φ = ángulo desde el eje z)",
    options: [
      { text: "Un plano horizontal", isCorrect: false, rationale: "Plano horizontal sería z = c." },
      { text: "Un cono con vértice en el origen", isCorrect: true, rationale: "φ constante define un cono." },
      { text: "Una esfera de radio π/4", isCorrect: false, rationale: "Eso sería ρ = constante." },
      { text: "Un cilindro", isCorrect: false, rationale: "Cilindro se asocia a r = constante." }
    ]
  }
];

let currentQuestionIndex = 0;
let score = 0;

const questionText = document.getElementById('question-text');
const answerOptionsContainer = document.getElementById('answer-options');
const rationaleText = document.getElementById('rationale-text');
const nextBtn = document.getElementById('next-btn');
const progressText = document.getElementById('progress-text');
const resultsContainer = document.getElementById('results-container');
const scoreText = document.getElementById('score-text');
const restartBtn = document.getElementById('restart-btn');
const questionContainer = document.getElementById('question-container');

function startQuiz() {
  currentQuestionIndex = 0;
  score = 0;
  resultsContainer.classList.add('hidden');
  questionContainer.classList.remove('hidden');
  answerOptionsContainer.classList.remove('hidden');
  progressText.classList.remove('hidden');
  nextBtn.classList.add('hidden');
  showQuestion();
}

function showQuestion() {
  resetState();
  const q = quizData[currentQuestionIndex];
  questionText.innerHTML = `<strong>Pregunta ${currentQuestionIndex + 1}:</strong> ${q.question}`;
  progressText.textContent = `Pregunta ${currentQuestionIndex + 1} de ${quizData.length}`;

  q.options.forEach(option => {
    const btn = document.createElement('button');
    btn.textContent = option.text;
    btn.className =
      'answer-btn w-full text-left p-4 border border-gray-300 rounded-md hover:bg-gray-100 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition';
    btn.addEventListener('click', () => selectAnswer(btn, option));
    answerOptionsContainer.appendChild(btn);
  });
}

function resetState() {
  answerOptionsContainer.innerHTML = '';
  rationaleText.textContent = '';
  nextBtn.classList.add('hidden');
}

function selectAnswer(button, option) {
  Array.from(answerOptionsContainer.children).forEach(btn => { btn.disabled = true; });

  if (option.isCorrect) {
    button.classList.add('correct');
    score++;
  } else {
    button.classList.add('incorrect');
    const correctOption = quizData[currentQuestionIndex].options.find(o => o.isCorrect);
    const correctBtn = Array.from(answerOptionsContainer.children)
      .find(b => b.textContent === correctOption.text);
    if (correctBtn) correctBtn.classList.add('correct');
  }
  rationaleText.textContent = `Justificación: ${option.rationale}`;
  nextBtn.classList.remove('hidden');
}

function showResults() {
  questionContainer.classList.add('hidden');
  answerOptionsContainer.classList.add('hidden');
  progressText.classList.add('hidden');
  nextBtn.classList.add('hidden');
  resultsContainer.classList.remove('hidden');
  scoreText.textContent = `Tu puntuación final es ${score} de ${quizData.length}.`;
}

nextBtn.addEventListener('click', () => {
  currentQuestionIndex++;
  if (currentQuestionIndex < quizData.length) {
    showQuestion();
  } else {
    showResults();
  }
});

restartBtn.addEventListener('click', startQuiz);
window.addEventListener('DOMContentLoaded', startQuiz);
</script>

</body>
</html>
